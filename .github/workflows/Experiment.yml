name: Reproducible experiment

on:
  pull_request:
    paths:
      - 'experiments/two_step_homotopy/**'
      - '.github/workflows/Experiment.yml'
      - 'Project.toml'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  experiment:
    name: two_step_homotopy on Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Instantiate experiment environment
        run: julia --project=experiments/two_step_homotopy -e 'using Pkg; Pkg.instantiate(); Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' > experiment-environment.txt
      - name: Check correctness and measure warmed runs
        run: julia --project=experiments/two_step_homotopy experiments/two_step_homotopy/run.jl | tee experiment-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two_step_homotopy-results
          path: |
            experiment-environment.txt
            experiment-results.txt
            experiments/two_step_homotopy/Manifest.toml
